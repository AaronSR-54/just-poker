<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <clipPath id="card">
      <rect x="2" y="2" width="196" height="276" rx="10"/>
    </clipPath>
    <pattern id="crosshatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="rgb(205,197,183)" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="diamonds" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M 10,2 L 14,14 L 10,26 L 6,14 Z" fill="none" stroke="rgb(205,197,183)" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect x="2" y="2" width="196" height="276" rx="10" fill="rgb(34,32,31)"/>

  <!-- Background patterns -->
  <rect x="17" y="17" width="166" height="246" rx="4" fill="url(#crosshatch)" clip-path="url(#card)"/>
  <rect x="17" y="17" width="166" height="246" rx="4" fill="url(#diamonds)" clip-path="url(#card)"/>

  <!-- Outer ornamental border -->
  <rect x="8" y="8" width="184" height="264" rx="7" fill="none" stroke="rgb(205,197,183)" stroke-width="2.5"/>
  <rect x="13" y="13" width="174" height="254" rx="5" fill="none" stroke="rgb(205,197,183)" stroke-width="0.75"/>
  <rect x="17" y="17" width="166" height="246" rx="4" fill="none" stroke="rgb(205,197,183)" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g stroke="rgb(205,197,183)" stroke-width="1" fill="none">
    <!-- Top-left -->
    <path d="M 24,30 Q 24,24 30,24"/>
    <path d="M 24,38 Q 24,24 38,24"/>
    <!-- Top-right -->
    <path d="M 176,30 Q 176,24 170,24"/>
    <path d="M 176,38 Q 176,24 162,24"/>
    <!-- Bottom-left -->
    <path d="M 24,250 Q 24,256 30,256"/>
    <path d="M 24,242 Q 24,256 38,256"/>
    <!-- Bottom-right -->
    <path d="M 176,250 Q 176,256 170,256"/>
    <path d="M 176,242 Q 176,256 162,256"/>
  </g>

  <!-- Side filigree -->
  <g stroke="rgb(205,197,183)" stroke-width="0.5" fill="none" opacity="0.6">
    <!-- Left side -->
    <path d="M 22,80 Q 28,90 22,100"/>
    <path d="M 22,110 Q 28,120 22,130"/>
    <path d="M 22,150 Q 28,160 22,170"/>
    <path d="M 22,180 Q 28,190 22,200"/>
    <!-- Right side -->
    <path d="M 178,80 Q 172,90 178,100"/>
    <path d="M 178,110 Q 172,120 178,130"/>
    <path d="M 178,150 Q 172,160 178,170"/>
    <path d="M 178,180 Q 172,190 178,200"/>
  </g>

  <!-- Central medallion -->
  <g transform="translate(100,140)">
    <!-- Outer glow ring -->
    <circle r="54" fill="none" stroke="rgb(205,197,183)" stroke-width="0.3" opacity="0.4"/>

    <!-- Outer ring -->
    <circle r="48" fill="none" stroke="rgb(205,197,183)" stroke-width="1"/>
    <circle r="44" fill="none" stroke="rgb(205,197,183)" stroke-width="1.5"/>

    <!-- Decorative ring with notches -->
    <circle r="38" fill="none" stroke="rgb(205,197,183)" stroke-width="0.5" stroke-dasharray="4 3"/>

    <!-- Cardinal tick marks -->
    <g stroke="rgb(205,197,183)" stroke-width="1">
      <line x1="0" y1="-48" x2="0" y2="-42"/>
      <line x1="0" y1="48" x2="0" y2="42"/>
      <line x1="-48" y1="0" x2="-42" y2="0"/>
      <line x1="48" y1="0" x2="42" y2="0"/>
    </g>

    <!-- Diagonal tick marks -->
    <g stroke="rgb(205,197,183)" stroke-width="0.5" opacity="0.6">
      <line x1="34" y1="-34" x2="31" y2="-31"/>
      <line x1="-34" y1="-34" x2="-31" y2="-31"/>
      <line x1="34" y1="34" x2="31" y2="31"/>
      <line x1="-34" y1="34" x2="-31" y2="31"/>
    </g>

    <!-- Inner decorative cross -->
    <g stroke="rgb(205,197,183)" stroke-width="0.4" fill="none" opacity="0.35">
      <path d="M 0,-34 Q 8,-8 34,0 Q 8,8 0,34 Q -8,8 -34,0 Q -8,-8 0,-34 Z"/>
    </g>

    <!-- Central diamond (poker favicon) -->
    <path d="M 0,-28 L 24,0 L 0,28 L -24,0Z" fill="rgb(205,197,183)"/>

    <!-- Inner diamond detail -->
    <path d="M 0,-18 L 15,0 L 0,18 L -15,0Z" fill="rgb(34,32,31)"/>
    <path d="M 0,-10 L 8,0 L 0,10 L -8,0Z" fill="rgb(205,197,183)" opacity="0.5"/>
  </g>

  <!-- Top and bottom decorative lines -->
  <g stroke="rgb(205,197,183)" stroke-width="0.5">
    <line x1="40" y1="50" x2="160" y2="50"/>
    <line x1="50" y1="53" x2="150" y2="53"/>
    <line x1="40" y1="230" x2="160" y2="230"/>
    <line x1="50" y1="227" x2="150" y2="227"/>
  </g>

  <!-- Small spade/pip marks at top and bottom center -->
  <g fill="rgb(205,197,183)">
    <path d="M 100,40 L 104,46 L 100,44 L 96,46 Z"/>
    <path d="M 100,240 L 104,234 L 100,236 L 96,234 Z"/>
  </g>

  <!-- Additional ornamental elements -->
  <g stroke="rgb(205,197,183)" stroke-width="0.5" fill="none">
    <!-- Top arch -->
    <path d="M 60,60 Q 100,70 140,60"/>
    <path d="M 65,63 Q 100,72 135,63"/>
    
    <!-- Bottom arch -->
    <path d="M 60,220 Q 100,210 140,220"/>
    <path d="M 65,217 Q 100,208 135,217"/>
    
    <!-- Vertical accent lines -->
    <line x1="100" y1="55" x2="100" y2="65"/>
    <line x1="100" y1="215" x2="100" y2="225"/>
  </g>

  <!-- Flourish scrolls near medallion -->
  <g stroke="rgb(205,197,183)" stroke-width="0.6" fill="none" opacity="0.45">
    <!-- Left scroll -->
    <path d="M 40,120 Q 35,130 40,140 Q 35,150 40,160"/>
    <path d="M 44,122 Q 39,132 44,140 Q 39,148 44,158"/>
    <!-- Right scroll -->
    <path d="M 160,120 Q 165,130 160,140 Q 165,150 160,160"/>
    <path d="M 156,122 Q 161,132 156,140 Q 161,148 156,158"/>
  </g>

  <!-- Small diamond accents along midline -->
  <g fill="rgb(205,197,183)" opacity="0.3">
    <path d="M 40,140 L 43,137 L 46,140 L 43,143 Z"/>
    <path d="M 154,140 L 157,137 L 160,140 L 157,143 Z"/>
    <path d="M 55,75 L 57,73 L 59,75 L 57,77 Z"/>
    <path d="M 141,75 L 143,73 L 145,75 L 143,77 Z"/>
    <path d="M 55,205 L 57,203 L 59,205 L 57,207 Z"/>
    <path d="M 141,205 L 143,203 L 145,205 L 143,207 Z"/>
  </g>
</svg>
